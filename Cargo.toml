[package]
name = "carvi_livox_sdk2"
version = "0.1.0"
edition = "2024"

[features]
default = ["vendored", "link-static"]

# Use a system-installed Livox-SDK2 (no network/build in build.rs).
system = []

# Vendor Livox-SDK2 from GitHub and build it via CMake during cargo build.
vendored = []

# Link preference (static-first; shared is optional).
link-static = []
link-shared = []

[dependencies]
autocxx = "0.30.0"
cxx = "1.0"

[dev-dependencies]
anyhow = "1.0.100"
rerun = { version = "0.28.1", features = ["web_viewer"] }

[build-dependencies]
autocxx-build = "0.30.0"
once_cell = "1.21.3"
pkg-config = "0.3.32"
walkdir = "2.5.0"
